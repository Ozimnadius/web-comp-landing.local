<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ВЕБ-КОМП</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#14171c">

    <link rel="stylesheet" href="/local/templates/template/styles.css">
</head>
<body>

<div class="wrapper">

    <div class="wrapper__header">
        <header class="header">
            <div class="container">
                <div class="header__inner">

                    <button class="header__burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="header-nav">
                        <span class="header__burger-icon" aria-hidden="true"></span>
                    </button>

                    <a class="header__logo" href="/">
                        <img class="header__logo-image" src="/upload/images/icons/logo.svg" alt="ВЕБ-КОМП" width="160" height="30">
                    </a>

                    <nav class="header__nav" id="header-nav">
                        <ul class="header__menu">
                            <li class="header__menu-item">
                                <a class="header__menu-link" href="#prices">Цены</a>
                            </li>
                            <li class="header__menu-item">
                                <a class="header__menu-link" href="#advantages">Преимущества</a>
                            </li>
                            <li class="header__menu-item">
                                <a class="header__menu-link" href="#portfolio">Примеры работ</a>
                            </li>
                            <li class="header__menu-item">
                                <a class="header__menu-link" href="#faq">Вопросы</a>
                            </li>
                            <li class="header__menu-item">
                                <a class="header__menu-link" href="#contacts">Контакты</a>
                            </li>
                        </ul>
                    </nav>

                    <div class="header__contacts">
                        <a class="header__phone" href="tel:+79991234567">
                            <span class="header__phone-icon" aria-hidden="true"></span>
                            <span class="header__phone-text">+7 (999) 123-45-67</span>
                        </a>
                        <button class="header__brief btn btn--invert" type="button" data-brief-open>Заполнить бриф</button>
                    </div>

                </div>
            </div>
        </header>
    </div>

    <div class="wrapper__content">

        <main class="main">
            <div class="main__hero"></div>
            <div class="main__metrics"></div>
            <div class="main__prices" id="prices"></div>
            <div class="main__advantages" id="advantages"></div>
            <div class="main__portfolio" id="portfolio"></div>
            <div class="main__faq" id="faq"></div>
            <div class="main__about" id="contacts"></div>
        </main>

    </div>

    <div class="wrapper__footer">
        <footer class="site-footer"></footer>
    </div>

</div>

<script src="/local/templates/template/js/scripts.min.js" defer></script>
</body>
</html>
